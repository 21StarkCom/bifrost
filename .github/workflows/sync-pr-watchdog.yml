name: sync-pr-watchdog

# Say, out loud, when the open `auto/marketplace-sync` PR can no longer be published.
#
# `publish-sync-pr` refuses unless `compare(main...head).status` is `ahead`, and it only
# ever runs on `pull_request_review: [submitted]`. Those two facts do not compose: the
# precondition is invalidated by a DIFFERENT event — any merge to `main` — and that event
# starts no publication attempt, so nothing evaluates it and nothing reports it. The
# regeneration then sits open and unpublishable until a human happens to look.
#
# Measured live 2026-09-20 (STARK-8164). PR #293 opened 03:52. Six hand merges landed on
# `main` between 08:10 and 13:30, the first of which diverged the sync branch. It was
# spotted by hand at ~15:24 — 11.5 hours, six causing events, zero runs, zero alarms.
# Publication for the whole repo was stopped for that entire window.
#
# This workflow does not heal, and cannot: repairing a diverged sync branch means
# REGENERATING it, which needs a stark-skills checkout and a token for that repo. bifrost
# holds neither — `gh secret list` is empty here and `secrets.GITHUB_TOKEN` is scoped to
# this repo — so the remediation is a `marketplace-sync` dispatch in stark-skills, named in
# the message below. Rebasing instead would be worse than useless: a stale regeneration
# replayed onto a newer `main` silently reverts whatever that `main` changed under
# `catalog/` or `dist/` (the web-registry removal touched six `.codex-plugin/plugin.json`
# files), which is exactly the class of damage `publish-sync-pr`'s refusal exists to stop.
#
# All three triggers are load-bearing and none covers another:
#   push   — fires at the instant a hand merge causes the divergence, so the alarm names
#            the cause. It cannot cover a merge made with GITHUB_TOKEN (GitHub's anti-loop
#            guard starts no run for one).
#   cron   — covers that gap, plus every strand this workflow's own question cannot see:
#            an attestation that was spent on a `publish-sync-pr` run that then failed, or
#            a PR simply left open. It reports on age alone, so it needs to understand
#            nothing about why.
#   manual — the only way to re-ask after a run died for an unrelated reason, and the way
#            back in once GitHub has auto-disabled the schedule for inactivity (below).
#
# GitHub disables a scheduled workflow after 60 days without repo activity and emails the
# owner. On a repo this quiet that is a real way for this alarm to go silent; re-enabling
# it is a one-click action on the Actions tab.

on:
  push:
    branches: [main]
  # Off the hour: GitHub delays crons scheduled at :00 under load.
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # the diagnosis is left on the PR, where the operator will look

# Never two at once, and never cancel one: the later run would leave the comment mid-edit.
concurrency:
  group: sync-pr-watchdog
  cancel-in-progress: false

jobs:
  watch:
    name: sync PR can still publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report whether the open sync PR is still publishable
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out, and `gh` resolves the repository from the working
          # directory's git remotes rather than from GITHUB_REPOSITORY — without GH_REPO
          # every call below dies on "not a git repository". Same reason
          # `publish-sync-pr.yml` sets it.
          GH_REPO: ${{ github.repository }}
          # How long a REGENERATION may sit before age alone is reported. The publication
          # latencies measured over the 37 merged sync PRs to 2026-09-20 are a median of
          # 1 minute and a maximum of 7.3 hours, so this is deliberately above the worst
          # legitimate case: the `ahead` check is the fast signal, this is the backstop.
          MAX_AGE_HOURS: '8'
        run: |
          set -euo pipefail

          # The whole decision, in one filter, so the Go test can extract and exercise the
          # REAL predicate instead of a copy of it (the idiom publish_sync_pr_test.go
          # established for the attestation check).
          #
          # Deliberately narrow: this asks only "can `publish-sync-pr` still succeed",
          # which is its `compare == ahead` precondition plus a clock. It does NOT restate
          # the attestation predicate — two copies of a gate is how one of them drifts, and
          # every other way publication fails already produces a red run of its own. What
          # nothing else evaluates is this precondition, because the event that falsifies
          # it triggers no evaluation at all.
          # shellcheck disable=SC2016
          verdict_filter='
            (.maxAgeHours | tonumber) as $max
            | (((.now | fromdateiso8601) - (.headCommittedAt | fromdateiso8601)) / 3600) as $age
            | if .compare != "ahead" then "stale: compare(main...head) is \"\(.compare)\", not \"ahead\" — publish-sync-pr will refuse"
              elif $age > $max then "aging: head is \($age | floor)h old with no publication (limit \($max | floor)h)"
              else "ok"
              end'

          # The query refuses a FORK head. `--head` matches the ref NAME, which carries no
          # owner — the same fact that makes publish-sync-pr check `isCrossRepository` —
          # and `gh pr list` answers newest-first, so a PR opened from any fork of this
          # public repo on a branch of that name would take `.[0]` and this watchdog would
          # spend every run reporting on it while the real strand went unseen. That is the
          # exact silence it exists to end, so forks are filtered out before the pick.
          pr="$(gh pr list --head auto/marketplace-sync --state open \
                  --json number,headRefOid,isCrossRepository \
                  --jq '[.[] | select(.isCrossRepository == false)] | .[0] // empty')"
          if [ -z "$pr" ]; then
            echo "no open auto/marketplace-sync PR — nothing to watch"
            exit 0
          fi
          number="$(printf '%s' "$pr" | jq -r '.number')"
          head="$(printf '%s' "$pr" | jq -r '.headRefOid')"

          # Shape guards for the same reason publish-sync-pr carries one: `jq -r` prints
          # the literal "null" for a missing field and exits 0, and an API path or a
          # `compare` bound to garbage would 404 into a verdict nobody can act on.
          case "$number" in
            ''|null|*[!0-9]*) echo "the sync PR reported an unusable number '$number'" >&2; exit 1 ;;
          esac
          case "$head" in
            ''|null|*[!0-9a-f]*) echo "PR #${number} reported an unusable head '$head'" >&2; exit 1 ;;
          esac

          # A read the API cannot answer is NOT a verdict. Withhold and go red rather than
          # letting a transport blip read as "the sync PR is fine".
          if ! compare="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${head}" --jq '.status')"; then
            echo "could not compare main...${head} — this is not a verdict" >&2
            exit 1
          fi

          # The age is anchored on the HEAD COMMIT, not on the PR's `createdAt`. The sync
          # branch is long-lived and force-pushed — stark-skills' marketplace-sync reuses
          # the open PR and only rewrites its title — so ONE PR carries regeneration after
          # regeneration while its creation time recedes. Measured on the very PR this
          # ticket is about: #293 was created 03:52 and its head pushed at 15:24, so a
          # `createdAt` clock would have called a four-hour-old, perfectly publishable
          # regeneration a 12-hour strand. Worse, the repair this workflow prescribes
          # (regenerate) moves the head and NOT `createdAt`, so doing what the alarm asks
          # could never clear it: red forever, on `main` as well as on the PR.
          #
          # Read from the git-database endpoint by SHA rather than from the PR's commit
          # list, so the date is the head's own by construction — `commits` is fetched
          # oldest-first and capped, so its `last` is only the head while the list is
          # short.
          if ! head_at="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${head}" --jq '.committer.date')"; then
            echo "could not read the head commit ${head} — this is not a verdict" >&2
            exit 1
          fi
          case "$head_at" in
            ''|null) echo "PR #${number}'s head ${head} reported no commit date" >&2; exit 1 ;;
          esac

          verdict="$(printf '%s' "$pr" \
            | jq -r --arg compare "$compare" \
                    --arg headCommittedAt "$head_at" \
                    --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    --arg maxAgeHours "$MAX_AGE_HOURS" \
                    '. + {compare: $compare, headCommittedAt: $headCommittedAt, now: $now, maxAgeHours: $maxAgeHours}' \
            | jq -r "$verdict_filter")"

          marker='<!-- sync-pr-watchdog -->'
          # `--slurp`, because `--jq` alongside `--paginate` runs the filter ONCE PER PAGE
          # and concatenates the outputs: a marker comment on two pages would make the id
          # below two lines and every URL built from it malformed.
          #
          # And the slurp is a SEPARATE step from the filter, because `gh api` refuses
          # `--slurp` together with `--jq` outright — "the `--slurp` option is not supported
          # with `--jq` or `--template`", on every version, not a runner quirk. That is what
          # killed this workflow's first live run (35523084147, STARK-8217): it died on gh's
          # usage text before reaching a verdict. `publish-sync-pr` has always had the right
          # shape — slurp into a variable, pipe to `jq` — and the flag was copied from it
          # without the shape. Pinned by TestWorkflowsNeverCombineSlurpWithJq, because
          # actionlint, shellcheck and a stubbed `gh` are all blind to it: the line is valid
          # shell, valid YAML, and a stub accepts flags the real binary rejects.
          #
          # A read the API cannot answer is not a verdict here either — and this one runs
          # AFTER the verdict, so a transport blip must not redden a perfectly publishable
          # PR with nothing but gh's own error to explain it. Same shape as the two guards
          # above; a bare `set -e` exit would be just as red and say nothing.
          if ! comments="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${number}/comments")"; then
            echo "could not read PR #${number}'s comments — this is not a verdict" >&2
            exit 1
          fi
          # `.body // ""` rather than `.body`: `startswith` on a null body aborts jq with
          # exit 5, and `pipefail` turns that into a run that died before saying anything.
          # The same guard, for the same reason, as publish-sync-pr's review filter.
          existing="$(printf '%s' "$comments" \
            | jq -r --arg marker "$marker" '[.[][] | select((.body // "") | startswith($marker))] | last // empty')"
          existing_id="$(printf '%s' "$existing" | jq -r '.id // empty')"
          existing_body="$(printf '%s' "$existing" | jq -r '.body // empty')"

          # Say it once. The cron re-asks every 30 minutes, so re-PATCHing a byte-identical
          # body would rewrite the comment 48 times a day for as long as the strand lasts —
          # and each rewrite touches the PR's `updatedAt`, which is exactly the kind of
          # self-inflicted activity a later staleness measure must not have to discount.
          upsert() {
            if [ "$existing_body" = "$1" ]; then
              return 0
            fi
            if [ -n "$existing_id" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -f "body=$1" >/dev/null
            else
              gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" -f "body=$1" >/dev/null
            fi
          }

          # Every line of the comment is a separate `printf` argument rather than a raw
          # newline in the script: a line at column 0 would end the YAML block scalar this
          # whole step lives in, and indenting the continuations instead would put four
          # leading spaces on each one, which Markdown renders as a code block.
          if [ "$verdict" = ok ]; then
            echo "PR #${number} is ahead of main and within the age limit — publishable"
            # Only edit a comment that is already there: a "resolved" note on a PR that
            # never had a problem would be noise.
            if [ -n "$existing_id" ]; then
              upsert "$(printf '%s\n' \
                "$marker" \
                "✅ Sync PR is publishable again (head \`${head:0:8}\`, ahead of \`main\`).")"
            fi
            exit 0
          fi

          # An `aging` PR is `ahead`: it CAN be published and simply has not been, and a
          # headline that says otherwise sends the reader to the wrong repair.
          case "$verdict" in
            stale:*) headline="🚨 **This regeneration cannot be published.**" ;;
            *)       headline="🚨 **This regeneration has not been published.**" ;;
          esac

          body="$(printf '%s\n' \
            "$marker" \
            "${headline} ${verdict}." \
            "" \
            "\`publish-sync-pr\` refuses to merge unless \`compare(main...head)\` is \`ahead\`," \
            "and it only runs on a review submission — so nothing re-evaluates this after" \
            "\`main\` moves. Until it is repaired, **every** stark-skills change is" \
            "unpublished, not just this one." \
            "" \
            "Repair is a regeneration, not a rebase — a stale regen replayed onto a newer" \
            "\`main\` reverts whatever that \`main\` changed under \`catalog/\` or \`dist/\`:" \
            "" \
            "\`gh workflow run marketplace-sync.yml --repo 21StarkCom/stark-skills --ref main\`" \
            "" \
            "If the branch is already \`ahead\` and this is an age report, publication failed" \
            "after the attestation instead — re-drive it:" \
            "" \
            "\`gh workflow run publish-sync-pr.yml --repo 21StarkCom/bifrost -f pr=${number}\`" \
            "" \
            "_Posted by \`sync-pr-watchdog\`; this comment is edited in place, not reposted._")"

          upsert "$body"

          # Red, every time, for as long as it is true. A green run here would be the same
          # "gate that cannot fail" this workflow was written to end.
          echo "::error::PR #${number}: ${verdict}"
          exit 1
