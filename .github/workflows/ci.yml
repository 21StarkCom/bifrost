name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Opt into Node 24 for JS actions ahead of the Sep 2026 forced cutover so
# Node-20 deprecation warnings stop and any incompatibility surfaces now —
# not when GitHub flips the default. (Reversible: drop this env to revert.)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # ONE pin for the whole workflow. Two jobs install this binary now — `secrets`
  # runs it as the gate, `engine` needs it on PATH for TestGitleaksConfigContract —
  # and a per-job copy is how the gate and the test that asserts on the gate's
  # config end up scanning with different rulesets.
  GITLEAKS_VERSION: 8.30.1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine (validate + drift + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # `check-bumps` asks "did content already published on main change under an
      # unchanged version", so it needs main's index.json. On a `pull_request` event
      # actions/checkout fetches ONLY `refs/pull/N/merge` — no remote-tracking branch —
      # and the gate then fell back to `HEAD:index.json`, which IS this PR's own index
      # (the drift gate forces it to be regenerated in the same commit). It therefore
      # compared the change to itself and could not fail. Measured 2026-09-20 on one
      # violating commit: `OK` with only the merge ref present, 7 violations once this
      # fetch had run (STARK-8161). Depth 1 is enough — a shallow commit carries its
      # whole tree. Keep this step: `prevIndexJSON` now refuses rather than passing when
      # the ref is missing, so dropping it turns the job red rather than quiet.
      #
      # This arms the `pull_request` run. The `push: [main]` run of this same job stays
      # vacuous and always will be: after a merge, HEAD and `origin/main` are the same
      # commit, so previous == current for every row no matter what the change did. That
      # is correct — the question "did this change publish content under an unchanged
      # version" can only be answered before it lands — but do not read a green
      # `check-bumps` on a `main` push as evidence of anything.
      - name: fetch main (the check-bumps baseline)
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
        working-directory: .
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: engine/go.mod   # pinned toolchain (spec §7.6)
          cache: true
      # TestGitleaksConfigContract shells to this binary to prove `.gitleaks.toml`
      # actually fires — including the `google-oauth-client-secret` probe the fleet
      # caller's self-test asserts on (STARK-7490). It t.Skip'd when the binary was
      # absent and NOTHING installed it in this job, so it had never once run in CI
      # while its own comment said it did: a rule whose regex drifted left every gate
      # here green and turned `secret-scan / secret-scan` red. The test now fails
      # instead of skipping when CI is set, so this step going missing is loud.
      - name: install gitleaks (pinned CLI, for the Go config-contract test)
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: gofmt (blocks unformatted Go)
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: unit + golden + determinism + integration tests
        run: go test ./... -count=1
      - name: stark validate (fail-closed, blocking)
        run: go run ./cmd/stark validate ../catalog
      - name: stark build --check (drift — REQUIRED, non-bypassable)
        run: go run ./cmd/stark build --check ../catalog
      - name: stark check-bumps (version-bump immutability — REQUIRED, blocking)
        run: go run ./cmd/stark check-bumps ../catalog
      - name: stark lint --strict (body suspicious-pattern scan — BLOCKING)
        run: go run ./cmd/stark lint --strict ../catalog
      - name: stark allowlist --check (docs/allowlist.md drift — BLOCKING)
        run: go run ./cmd/stark allowlist --check ../docs/allowlist.md

  secrets:
    name: secret scan (catalog)
    runs-on: ubuntu-latest
    # gitleaks-action@v2 requires a paid license for GitHub orgs; the CLI is free
    # (MIT). Pin + run the binary directly so the gate stays fail-closed and
    # licence-free. The pin is workflow-level (see `env:` at the top).
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0   # full history so the PR-range scan below can diff base..head
      - name: install gitleaks (pinned CLI)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: gitleaks — working tree (fail-closed)
        run: gitleaks dir . --config .gitleaks.toml --redact --exit-code 1 --verbose
      - name: gitleaks — PR commit history (catches a secret added then removed within the PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git . --config .gitleaks.toml --redact --exit-code 1 --log-opts "${BASE_SHA}..${HEAD_SHA}"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7
