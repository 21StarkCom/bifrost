name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Opt into Node 24 for JS actions ahead of the Sep 2026 forced cutover so
# Node-20 deprecation warnings stop and any incompatibility surfaces now —
# not when GitHub flips the default. (Reversible: drop this env to revert.)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # ONE pin. Only `secrets` installs this binary now; the Go config-contract test
  # that was the second consumer went with the engine. The pin stays at workflow
  # level so a second consumer cannot reintroduce a per-job version skew.
  GITLEAKS_VERSION: 8.30.1

# GitHub counts a CANCELLED required check as FAILING, and `main` has already
# carried commits with `engine: cancelled` from back-to-back merges sharing the
# `ci-refs/heads/main` group. With `test` and `typecheck` becoming required
# contexts, a cancelled run is a blocked merge that only a new commit clears.
#
# `cancel-in-progress: false` alone does NOT buy "never cancelled": GitHub also
# cancels a run that is merely PENDING in the group when a newer one queues
# behind it. Keying the non-PR half on `github.sha` rather than `github.ref` is
# what actually retires the measured failure — every push to `main` lands in its
# own group, so no merge can ever queue behind (and therefore cancel) another
# merge's run. The PR half stays keyed on the PR number so a PR's runs still
# serialize; a superseded pending run there is on a sha that is no longer the
# head, which no required context is read against.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  secrets:
    name: secret scan (tree)
    runs-on: ubuntu-latest
    # gitleaks-action@v2 requires a paid license for GitHub orgs; the CLI is free
    # (MIT). Pin + run the binary directly so the gate stays fail-closed and
    # licence-free. The pin is workflow-level (see `env:` at the top).
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0   # full history so the PR-range scan below can diff base..head
      - name: install gitleaks (pinned CLI)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # ── Self-test: prove the load-bearing rule actually FIRES ────────────────
      #
      # Runs BEFORE the two scans below, for the reason the fleet caller runs its
      # own copy first: a clean scan is not evidence until you have watched the
      # scanner fire. `tools/repo_contracts.test.ts` asserts only that
      # `.gitleaks.toml` CONTAINS the id `google-oauth-client-secret` — a
      # substring check over a config file. A commented-out rule, a regex whose
      # quantifier drifted, or an entropy floor raised past the probe all leave
      # that id spelled in the file while the rule matches nothing, and the
      # whole-tree scan below still reports clean. This step is the dynamic half
      # the deleted Go `TestGitleaksConfigContract` used to carry.
      #
      # It lives HERE and not only in `.github/workflows/secret-scan.yml`'s fleet
      # caller — which does run the same probe — because that caller is not a
      # required context on this repo, so its red does not block a merge. This
      # job (`secret scan (tree)`) is required. Put the proof behind the gate.
      #
      # Why the rule is load-bearing: the fleet's reusable workflow refuses to
      # trust a clean scan until it has watched this exact id fire, so dropping
      # or renaming the rule turns `secret-scan / secret-scan` RED on a repo with
      # no secrets in it — and carrying it verbatim is what lets bifrost run the
      # fleet's default caller with no per-repo `selftest_rule_id` override.
      - name: gitleaks — self-test (google-oauth-client-secret must fire)
        env:
          SELFTEST_RULE: google-oauth-client-secret
        run: |
          set -euo pipefail
          # OUTSIDE the checkout on both counts: the fail-closed whole-tree scan
          # below walks `.` and would flag the probe as a real leak, and a file
          # under /tmp can never be committed by accident.
          probe_dir="$(mktemp -d)"
          report="$(mktemp -d)/selftest.json"
          # Assembled from a prefix + a separate variable so THIS file never holds
          # a literal the rule matches: ci.yml is inside the tree that scan walks.
          suffix='0f1e2d3c4b5a69788796a5b4c3d2'
          printf 'note: GOCSPX-%s\n' "$suffix" > "$probe_dir/probe.txt"

          # `--exit-code 0` is deliberate. gitleaks exits NON-ZERO when it finds
          # something, and a finding is this step's SUCCESS path — under a bare
          # `set -e` the step would abort exactly when the rule works. Pinned to
          # 0, a non-zero exit means one thing only: the scanner could not run.
          if ! gitleaks dir "$probe_dir" --config .gitleaks.toml --redact --no-banner \
              --exit-code 0 --report-format json --report-path "$report"; then
            echo "::error::gitleaks could not run against .gitleaks.toml (unreadable or invalid config). The required secret gate is not scanning anything."
            exit 1
          fi

          # Parse the JSON report, never human output, and assert the RULE ID —
          # "something was found" would pass on an unrelated rule matching the probe.
          rc=0
          jq -e 'any(.[]?; .RuleID == env.SELFTEST_RULE)' "$report" >/dev/null || rc=$?
          case "$rc" in
            0)
              echo "ok: rule '${SELFTEST_RULE}' fired on the probe"
              ;;
            1)
              echo "::error::.gitleaks.toml no longer fires rule '${SELFTEST_RULE}' on a bare GOCSPX- token. That rule is load-bearing: the fleet's reusable secret scan refuses to trust a clean scan until it has watched this exact id fire, so this turns secret-scan RED fleet-side on a repo with no secrets in it. Restore the rule (id, regex and entropy floor) in .gitleaks.toml."
              echo "rule ids found on the probe: $(jq -r 'if length == 0 then "(none — the scan matched nothing at all)" else ([.[].RuleID] | unique | join(", ")) end' "$report")"
              exit 1
              ;;
            *)
              # jq exits 1 for a false result but 2/3/4/5 for usage, compile, no-result
              # and runtime errors. Returning that status raw would make a broken
              # predicate indistinguishable from "the rule did not fire".
              echo "::error::could not evaluate the gitleaks report (jq exit ${rc}) — treat as NOT proven, not as a pass."
              exit 1
              ;;
          esac
      - name: gitleaks — working tree (fail-closed)
        run: gitleaks dir . --config .gitleaks.toml --redact --exit-code 1 --verbose
      - name: gitleaks — PR commit history (catches a secret added then removed within the PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git . --config .gitleaks.toml --redact --exit-code 1 --log-opts "${BASE_SHA}..${HEAD_SHA}"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7

  # ── The TypeScript suite over tools/ ───────────────────────────────────────
  #
  # `tools/` moved here from stark-skills, where these two jobs were `tests.yml`
  # and both were REQUIRED contexts. They are the required contexts HERE now
  # too: with the Go engine deleted, this suite plus the two scanners below is
  # the whole gate, so a red `test` is the only thing standing between a broken
  # tool and `main`.
  #
  # Neither job sets a job-level `name:`, deliberately — that leaves the reported
  # contexts as the bare job ids `test` and `typecheck`, the same strings
  # stark-skills' ruleset required. Adding a `name:` later renames the context and
  # orphans the requirement, which blocks every merge on "Expected — waiting for
  # status" until someone edits the ruleset back.
  #
  # Do NOT add `if:`, a draft guard, or a `paths:` filter to either job. A guarded
  # job reports `skipped`, GitHub counts `skipped` as SATISFYING a required check
  # and renders it identically to a pass, and only a new commit clears it. That is
  # how stark-skills#877 merged with its suite never having executed.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Type-stripping runs `.ts` with no build step but is only ON by default
          # from Node 23.6; `node:sqlite` (tools/stark_persona_lib.ts) also needs a
          # recent runtime. 24 is the oldest LTS carrying both, and matches the
          # `engines.node` floor in tools/package.json.
          node-version: '24'
      # No `npm ci` on this path: every import in the suite is a `node:` builtin.
      # tools/'s only devDependencies (typescript, @types/node) belong to the
      # typecheck job below. `npm test` = ./check-rest-only.sh && node --test *.test.ts.
      - name: npm test (tools/)
        working-directory: tools
        run: npm test

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: install typecheck deps
        working-directory: tools
        run: npm ci
      # Its own job because `node --test` does NOT typecheck: the suite runs `.ts`
      # through Node's type-stripping, which ERASES annotations rather than checking
      # them. A wrong generic or an unsound cast passes every test in `test`.
      #
      # NEVER put `continue-on-error: true` on this step. It carried that flag in
      # stark-skills while the check was advisory, which made the CHECK report
      # SUCCESS whether or not `tsc` passed — errors visible only in the step log.
      # That is why the check could not simply be added to a ruleset: requiring a
      # `continue-on-error` step satisfies the gate unconditionally.
      #
      # `npm run typecheck`, NOT `npx tsc -p .`: with no TTY on stdin, `npx`
      # downloads a missing package from the registry instead of failing, so a
      # dropped devDependency would move this gate onto an unpinned latest
      # TypeScript without a word. `npm run` resolves the locked local binary or errors.
      - name: npm run typecheck (tools/)
        working-directory: tools
        run: npm run typecheck
