# Publish the marketplace sync PR when the operator's review attestation lands.
#
# This is the second half of stark-skills' `marketplace-sync`. That workflow
# regenerates this repo and pushes `auto/marketplace-sync`; it does NOT merge.
# Publication is gated on an operator attestation that can arrive minutes or
# days later, so it is driven by the `pull_request_review` event rather than by
# a runner holding a clock open.
#
# STARK-6208: the previous design waited up to 20 minutes inside the sync run.
# Four consecutive runs expired that window, and the two after them were killed
# at 6 and 9 minutes by `cancel-in-progress` when the next stark-skills merge
# landed — so the window could never close at this repo's real merge cadence.
#
# The gate itself is UNCHANGED and is re-verified here: same author, same
# marker, same exact-head binding, same pre-merge recheck, same
# `--match-head-commit`. CI alone still never authorizes publication.
name: publish-sync-pr

on:
  pull_request_review:
    types: [submitted]
  # Manual re-drive for an attestation that was already submitted (e.g. this
  # workflow was red for an unrelated reason when the review came in).
  workflow_dispatch:
    inputs:
      pr:
        description: "Sync PR number to publish"
        required: true

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  # Dispatch `sign-manifest` after the merge. A push made with GITHUB_TOKEN does
  # NOT start a new workflow run (GitHub's anti-loop guard — the same one
  # `sign-manifest.yml` already names for tag pushes), so merging from here
  # would land an unsigned, untagged, unreleased `main`. `workflow_dispatch` is
  # the documented exception to that guard, so publication re-arms the release
  # chain explicitly.
  actions: write

# Never cancel a publication in flight: unlike a regeneration, it is not
# superseded by a newer one. Serialize per PR instead.
concurrency:
  group: publish-sync-pr-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: false

jobs:
  publish:
    # Cheap event-shape guard. The real authorization is the attestation check
    # in the step below, which re-reads the reviews from the API rather than
    # trusting the event payload: `github.event.review.body` is the submitted
    # body, but a later CHANGES_REQUESTED or DISMISSED review on the same head
    # must still win, and only the API shows that.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.ref == 'auto/marketplace-sync' &&
       github.event.review.user.login == 'aryeh-stark')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify the attestation, then merge on green CI
        env:
          GH_TOKEN: ${{ github.token }}
          # This job deliberately never checks out. `gh pr ...` resolves the
          # repository from the working directory's git remotes and does NOT
          # read GITHUB_REPOSITORY, so without GH_REPO every `gh pr` call below
          # dies with "failed to run git: fatal: not a git repository" and the
          # run goes red on the very first line.
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          set -euo pipefail

          # $PR is interpolated into API URL paths below; on workflow_dispatch
          # it is free text. Anything but digits could re-point the endpoint.
          case "$PR" in
            ''|*[!0-9]*) echo "PR must be a number, got '$PR'" >&2; exit 1 ;;
          esac

          # Identical to the filter this replaces. The latest submitted review
          # by the operator on the EXACT head must be COMMENTED or APPROVED and
          # carry the completion marker on its own first line. Pages are slurped
          # together so an older matching page cannot hide a later
          # CHANGES_REQUESTED or DISMISSED review on the same head. The body is
          # CRLF-normalized first: GitHub returns web-UI-authored review bodies
          # with \r\n, so matching the raw text would reject the attestation an
          # operator actually types.
          # shellcheck disable=SC2016
          review_filter='[.[][] | select(.user.login == "aryeh-stark" and .commit_id == $head and .submitted_at != null)]
            | sort_by(.submitted_at, .id) | last
            | . != null and (.state == "COMMENTED" or .state == "APPROVED")
              and (((.body // "") | gsub("\r\n"; "\n")) | startswith("<!-- stark-code-review:complete -->\n") and contains("/code-review xhigh --fix"))'

          # Three outcomes, never two: 0 = attested, 1 = not attested, 2 = COULD
          # NOT TELL. A transport blip must not read as "the operator withdrew
          # the attestation" on the pre-merge recheck — and, just as important,
          # a BROKEN PREDICATE must not read as "nobody attested".
          #
          # `jq -e` exits 1 for a false/null result but 3 for a compile error and
          # 5 for a runtime error, and those are not verdicts. Returning jq's
          # status raw folded 3 and 5 into the caller's "not attested" branch,
          # which exits GREEN — so a typo in the predicate, or a payload shape it
          # cannot handle (a `null` body with no `// ""` guard aborts with 5),
          # would have stopped publication forever with every run green and no
          # alarm anywhere. That is precisely the silent-stall STARK-6208 was
          # filed to end; it must fail closed and loud instead.
          completed_review() {
            local reviews status=0
            reviews="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/$PR/reviews")" || return 2
            # `|| status=$?` rather than a bare pipeline followed by `status=$?`:
            # under `set -e` the latter only survives because every caller invokes
            # this function on the left of `||`, which suppresses errexit through
            # the whole body. That is true today and silently stops being true the
            # first time someone calls it plainly.
            printf '%s' "$reviews" | jq -e --arg head "$1" "$review_filter" >/dev/null || status=$?
            case "$status" in
              0|1) return "$status" ;;
              *) echo "the attestation predicate itself failed (jq exit $status) — this is not a verdict" >&2
                 return 2 ;;
            esac
          }

          # One round trip for every field the guards below read, so they all
          # judge the SAME snapshot of the PR.
          pr_json="$(gh pr view "$PR" --json headRefOid,headRefName,baseRefName,isDraft,isCrossRepository)"
          head="$(printf '%s' "$pr_json" | jq -r '.headRefOid')"
          ref="$(printf '%s' "$pr_json" | jq -r '.headRefName')"
          base="$(printf '%s' "$pr_json" | jq -r '.baseRefName')"
          is_draft="$(printf '%s' "$pr_json" | jq -r '.isDraft')"
          cross="$(printf '%s' "$pr_json" | jq -r '.isCrossRepository')"

          # On workflow_dispatch the event-shape guard above did not run, so the
          # branch is checked here. Publishing an arbitrary PR through this path
          # would bypass the review gate entirely. The cross-repo half matters on
          # the event path too: `pull_request_review` is a privileged event that
          # fires for FORK PRs as well, and `headRefName` carries no owner — a
          # fork branch of the same name reads identically to the sync branch.
          if [ "$ref" != "auto/marketplace-sync" ] || [ "$cross" != false ]; then
            echo "PR #${PR} is on '$ref' (cross-repository: $cross), not this repo's sync branch; refusing to publish" >&2
            exit 1
          fi

          rc=0
          completed_review "$head" || rc=$?
          if [ "$rc" -eq 2 ]; then
            # Either the API was unreadable or the predicate is broken; the
            # function has already said which on stderr. Both are "could not
            # tell", and neither may pass for "nobody attested".
            echo "could not determine the attestation state; publication withheld" >&2
            exit 1
          elif [ "$rc" -ne 0 ]; then
            # Not an error: most review submissions are not attestations. Exit
            # green so the PR's checks are not polluted with a red run for an
            # ordinary comment.
            echo "no completed operator attestation on $head; nothing to publish"
            exit 0
          fi
          echo "attestation verified on $head"

          if [ "$is_draft" = true ]; then
            gh pr ready "$PR"
          fi

          # `--required` throughout, and not a cosmetic narrowing: a workflow run
          # triggered by `pull_request_review` attaches its check run to the PR's
          # HEAD commit exactly as a `pull_request` run does, so THIS job shows up
          # in `gh pr checks` as a permanently in-progress check. Watching the
          # unfiltered set makes the step wait on itself until the job timeout and
          # publication can never happen. The required set is the ruleset's five
          # `ci` contexts, which is also the gate `main` actually enforces.
          #
          # Wait for those checks to EXIST — a positive assertion on the count,
          # not on an exit code — because "zero checks" and "all checks green"
          # are the two states `--watch` cannot tell apart, and merging on the
          # first would be a gate that passes by finding nothing to measure.
          count=0
          for _ in $(seq 1 30); do
            count="$(gh pr checks "$PR" --required --json name --jq 'length' 2>/dev/null || echo 0)"
            [ "$count" -gt 0 ] && break
            sleep 10
          done
          if [ "$count" -eq 0 ]; then
            echo "no required check runs registered for PR #${PR} after 5 minutes — refusing to merge unverified" >&2
            exit 1
          fi
          echo "watching $count required check run(s) on PR #${PR}"
          gh pr checks "$PR" --required --watch --fail-fast

          # The head must not have moved, and the attestation must still stand,
          # after however long CI took. The sync branch is shared and
          # force-updated, so this is a live race, not a theoretical one. Checked
          # BEFORE the compare below: a force-push can leave the attested SHA
          # unreachable, and then `compare` 404s with an opaque error instead of
          # this line naming what actually happened.
          now="$(gh pr view "$PR" --json headRefOid --jq '.headRefOid')"
          if [ "$now" != "$head" ]; then
            echo "head moved $head -> $now while waiting for CI; merge withheld" >&2
            exit 1
          fi

          # `identical` is not mergeable — the base already contains this head, so
          # `gh pr merge` would fail anyway. Name it here instead of later.
          base_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/$base...$head" --jq '.status')"
          if [ "$base_status" != ahead ]; then
            echo "reviewed head is '$base_status' vs $base, not ahead; merge withheld" >&2
            exit 1
          fi

          recheck=0
          completed_review "$head" || recheck=$?
          if [ "$recheck" -eq 2 ]; then
            echo "could not re-determine the attestation state before merging; merge withheld" >&2
            exit 1
          elif [ "$recheck" -ne 0 ]; then
            echo "completed head review changed while waiting for CI; merge withheld" >&2
            exit 1
          fi

          gh pr merge "$PR" --squash --match-head-commit "$head"
          echo "published: PR #${PR} merged at $head"

          # The squash push above was made with GITHUB_TOKEN, and GitHub's
          # anti-loop guard means such a push starts NO workflow run — so
          # `sign-manifest` (on: push to main), which signs the build manifest
          # and cuts `v<VERSION>` + the signed release, would never fire for a
          # published sync. It did fire under the old design only because the
          # merge was made with the stark-meridian-ci App token. `workflow_dispatch`
          # is the documented exception to the guard, so re-arm it explicitly.
          # sign-manifest is idempotent per-SHA, so a redundant dispatch is safe.
          gh workflow run sign-manifest.yml --ref "$base"
          echo "dispatched sign-manifest on $base"
